aid: hey
name: Hey
description: heycater! is a B2B catering marketplace that connects companies with vetted
  catering partners across Germany and the United Kingdom, letting businesses request,
  compare, and book corporate food services through a single platform. Its service
  lines span heykantine! (daily office meals for teams of 50+), Meetings & Catering
  (event catering from 10 people drawing on 700+ vetted caterers), hey! Events (full-service
  event planning for ~100+ guests), and a Pantry Service for office beverages and snacks.
  The platform serves 2,500+ companies, including Spotify, Airbnb, Meta, and Salesforce,
  and has fulfilled more than 250,000 catering orders, returning comparable quotes
  within 48 hours at no cost. heycater! does not currently publish a public API or
  developer program; this profile captures its public web presence and domain-security
  posture.
